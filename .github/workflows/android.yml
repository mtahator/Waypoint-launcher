name: Android CI

on:
  push:
    branches: [ main, develop, 'claude/**', 'feat/**' ]
    paths-ignore: [ 'apk/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee -a build.log

      - name: Build release APK
        shell: bash
        env:
          WAYPOINT_KEYSTORE_B64: ${{ secrets.WAYPOINT_KEYSTORE_B64 }}
          WAYPOINT_KEYSTORE_PASSWORD: ${{ secrets.WAYPOINT_KEYSTORE_PASSWORD }}
          WAYPOINT_KEY_ALIAS: ${{ secrets.WAYPOINT_KEY_ALIAS }}
          WAYPOINT_KEY_PASSWORD: ${{ secrets.WAYPOINT_KEY_PASSWORD }}
        run: |
          if [ -n "$WAYPOINT_KEYSTORE_B64" ]; then
            echo "$WAYPOINT_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export WAYPOINT_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          fi
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee -a build.log

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Summarize errors
        if: failure()
        shell: bash
        run: |
          { echo '### Build errors'; echo '```'; grep -E '^e: |^w: .*error|error:|FAILED|What went wrong' -A2 build.log | head -150; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: waypoint-build
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/reports/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: waypoint-apk
          path: app/build/outputs/apk/release/app-release.apk

      # Commit the freshly built APK back to the branch so it can be downloaded straight from the repo.
      - name: Publish APK to repository
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/release/app-release.apk apk/Waypoint.apk
          VERSION=$(grep -m1 versionName app/build.gradle | sed -E 's/.*"(.*)".*/\1/')
          printf 'Waypoint %s\nBuilt from %s on %s\nSHA-256: %s\n' "$VERSION" "$GITHUB_SHA" "$(date -u +%FT%TZ)" \
            "$(sha256sum apk/Waypoint.apk | cut -d' ' -f1)" > apk/BUILD_INFO.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/Waypoint.apk apk/BUILD_INFO.txt
          git commit -m "chore(apk): build Waypoint ${VERSION} from ${GITHUB_SHA::7} [skip ci]" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1

  # Installs the release APK on an emulator, walks the main screens (incl. the glass theme), fails on any
  # crash, and commits screenshots to docs/screenshots.
  smoke:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          name: waypoint-apk
          path: smoke-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/smoke.sh smoke-apk/app-release.apk smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: smoke/

      - name: Commit screenshots
        if: always()
        run: |
          mkdir -p docs/screenshots
          cp smoke/*.png docs/screenshots/ 2>/dev/null || exit 0
          cp smoke/crash.txt docs/screenshots/ 2>/dev/null || rm -f docs/screenshots/crash.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/screenshots
          git commit -m "chore(screenshots): emulator smoke test of ${GITHUB_SHA::7} [skip ci]" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
