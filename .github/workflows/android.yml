name: Android CI

on:
  push:
    branches: [ main, develop, 'claude/**', 'feat/**' ]
    paths-ignore: [ 'apk/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build release APK
        env:
          WAYPOINT_KEYSTORE_B64: ${{ secrets.WAYPOINT_KEYSTORE_B64 }}
          WAYPOINT_KEYSTORE_PASSWORD: ${{ secrets.WAYPOINT_KEYSTORE_PASSWORD }}
          WAYPOINT_KEY_ALIAS: ${{ secrets.WAYPOINT_KEY_ALIAS }}
          WAYPOINT_KEY_PASSWORD: ${{ secrets.WAYPOINT_KEY_PASSWORD }}
        run: |
          if [ -n "$WAYPOINT_KEYSTORE_B64" ]; then
            echo "$WAYPOINT_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export WAYPOINT_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          fi
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: waypoint-build
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/reports/
          if-no-files-found: ignore

      # Commit the freshly built APK back to the branch so it can be downloaded straight from the repo.
      - name: Publish APK to repository
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/release/app-release.apk apk/Waypoint.apk
          VERSION=$(grep -m1 versionName app/build.gradle | sed -E 's/.*"(.*)".*/\1/')
          printf 'Waypoint %s\nBuilt from %s on %s\nSHA-256: %s\n' "$VERSION" "$GITHUB_SHA" "$(date -u +%FT%TZ)" \
            "$(sha256sum apk/Waypoint.apk | cut -d' ' -f1)" > apk/BUILD_INFO.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/Waypoint.apk apk/BUILD_INFO.txt
          git commit -m "chore(apk): build Waypoint ${VERSION} from ${GITHUB_SHA::7} [skip ci]" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
